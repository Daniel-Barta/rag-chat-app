<div class="message" [class.user]="isUser" [class.assistant]="!isUser">
  <div class="message-avatar">
    @if (isUser) {
      <div class="avatar user-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    } @else {
      <div class="avatar assistant-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
          <path d="M7.5 13a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path>
          <path d="M16.5 13a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path>
        </svg>
      </div>
    }
  </div>

  <div class="message-content">
    <div class="message-header">
      <span class="message-role">{{ isUser ? 'You' : 'Assistant' }}</span>
      <span class="message-time">{{ formatTime(message.timestamp) }}</span>
    </div>

    <div class="message-body">
      @if (message.isLoading) {
        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      } @else if (isUser) {
        <p class="user-text">{{ message.content }}</p>
      } @else {
        <div class="markdown-content" [innerHTML]="renderedContent"></div>
      }
    </div>

    @if (!isUser && hasSourcesRef && !message.isLoading) {
      <div class="message-footer">
        <button class="sources-btn" (click)="onShowSources()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>{{ message.sources!.length }} source{{ message.sources!.length === 1 ? '' : 's' }}</span>
        </button>
      </div>
    }
  </div>
</div>
