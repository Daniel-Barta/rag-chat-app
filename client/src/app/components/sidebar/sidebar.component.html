<aside class="sidebar" [class.collapsed]="!isOpen">
  <div class="sidebar-header">
    <button class="new-chat-btn" (click)="onNewChat()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>New chat</span>
    </button>
  </div>

  <div class="conversations-list">
    @if (conversations.length === 0) {
      <div class="no-conversations">
        <p>No conversations yet</p>
      </div>
    } @else {
      @for (conversation of conversations; track conversation.id) {
        <div 
          class="conversation-item"
          [class.active]="conversation.id === activeConversationId"
          (click)="onSelectConversation(conversation.id)">
          <div class="conversation-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div class="conversation-content">
            <span class="conversation-title">{{ conversation.title }}</span>
            <span class="conversation-date">{{ formatDate(conversation.updatedAt) }}</span>
          </div>
          <button class="delete-btn" (click)="onDeleteConversation($event, conversation.id)" title="Delete conversation">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      }
    }
  </div>

  <div class="sidebar-footer">
    <div class="app-info">
      <span class="app-name">RAG Chat</span>
      <span class="app-version">v1.0.0</span>
    </div>
  </div>
</aside>
